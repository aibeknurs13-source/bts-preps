<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>БТС — подготовка к экзамену</title>

<style>

.ck button.n{background:#262f45}.ck button.op{background:#2b3250;color:#a5b4fc}.ck button.eq{background:var(--c,#6366f1);border:0;color:#fff}.ck button:active{transform:scale(.95)}

.chip{flex:none;padding:6px 12px;border-radius:99px;border:1px solid var(--bd);background:var(--c1);font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.opt.ok{border-color:#22c55e;background:#22c55e22}.opt.no{border-color:#ef4444;background:#ef444422}.opt.gone{opacity:.22;pointer-events:none}.opt:disabled{cursor:default}
.hintbox{background:#f59e0b14;border:1px solid #f59e0b66;border-radius:12px;padding:6px 14px;margin:8px 0}.hintbox ul{margin:6px 0;padding-left:18px}.hintbox li{margin:3px 0}

.mqq{border-top:1px dashed var(--bd);padding:12px 0}.mqq:first-of-type{border-top:0}.mqn{color:var(--mu);font-size:11px;font-weight:700;letter-spacing:.08em;margin-bottom:2px}
.mqs{margin-top:10px;padding:12px;border-radius:12px;background:var(--c2)}

.st3{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:14px 0}.st3 div{background:var(--c1);border:1px solid var(--bd);border-radius:16px;padding:14px;text-align:center}.st3 b{display:block;font-size:26px}.st3 span{color:var(--mu);font-size:12px}
.dsub{border-left:4px solid var(--c)}.bdg{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.dst{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--mu);font-size:13px;margin:8px 0}.rec{margin:8px 0;padding:8px 12px;border-radius:10px;background:var(--c2);font-size:14px}

/* ---------- auth ---------- */
body.auth-lock header,body.auth-lock main{display:none}
#auth{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:radial-gradient(900px 500px at 75% -10%,#2a236666,transparent),radial-gradient(700px 400px at 10% 110%,#1e3a5f55,transparent),#0b0e14}
#auth .ac{width:min(94vw,400px);background:linear-gradient(160deg,#161c2c,#10141f);border:1px solid var(--bd);border-radius:26px;padding:34px 28px;text-align:center;box-shadow:0 24px 80px #000c;position:relative;overflow:hidden}
#auth .ac::before{content:'';position:absolute;inset:-1px;border-radius:26px;padding:1px;background:linear-gradient(135deg,#6366f1,#8b5cf6,#22d3ee);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;opacity:.55}
#auth .lg{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;font-size:30px;font-weight:800;margin:0 auto 16px;box-shadow:0 10px 30px #6366f155}
#auth h1{margin:0 0 4px;font-size:24px}#auth .mu{margin:0 0 22px}
#gbtn{display:flex;justify-content:center;min-height:44px}
.ganon{margin-top:14px;background:none;border:0;color:var(--mu);font:inherit;font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
#auth .note{font-size:11.5px;color:var(--mu);margin:20px 0 0;line-height:1.5}
.uav{width:24px;height:24px;border-radius:50%;vertical-align:-6px;margin-right:5px;object-fit:cover}
</style></head>
<body>
<header id="hd"></header><main id="main"></main>
<div id="auth" style="display:none"><div class="ac">
<div class="lg">Б</div><h1>БТС — подготовка к экзамену</h1>
<p class="mu">Войдите, чтобы ваш прогресс, тесты и карточки всегда были с вами</p>
<div id="gbtn"></div>
<p class="note">💾 Все данные (тесты, карточки, конспекты, очки, серия дней) привязываются к вашему аккаунту и сохраняются в браузере даже после закрытия сайта.</p>
</div></div>
<script>
const SUBS=[
{id:'algebra',n:'Algebra',ru:'Алгебра',e:'∑',c:'#6366f1'},
{id:'biology',n:'Biology',ru:'Биология',e:'🧬',c:'#22c55e'},
{id:'qazaq',n:'Қазақ тілі',ru:'Казахский язык',e:'📖',c:'#f59e0b',kk:1},
{id:'chemistry',n:'Chemistry',ru:'Химия',e:'⚗',c:'#a855f7'},
{id:'physics',n:'Physics',ru:'Физика',e:'⚛',c:'#06b6d4'},
{id:'history',n:'Қазақстан тарихы',ru:'История Казахстана',e:'🏛',c:'#ef4444',kk:1}];
const S={sub:null,tab:'test',run:null,deck:null,user:null,dash:0};
const $=s=>document.querySelector(s),M=$('#main');
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const kx=r=>window.renderMathInElement&&renderMathInElement(r||M,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});
const toast=t=>{const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),4000)};
/* ---------- figures ---------- */
const st=r=>{const d=r/8,m=10**Math.floor(Math.log10(d));return[1,2,5,10].map(k=>k*m).find(k=>k>=d)};
const cf=s=>{s=String(s).replace(/\^/g,'**');if(/[^\dxy\s.+\-*/()]/.test(s.replace(/sqrt|abs|sin|cos|ln|exp|pi/g,'')))return()=>NaN;try{const f=Function('x','y','sqrt','abs','sin','cos','ln','exp','pi','return('+s+')');return(x,y)=>f(x,y,Math.sqrt,Math.abs,Math.sin,Math.cos,Math.log,Math.exp,Math.PI)}catch(e){return()=>NaN}};
function fig(g){if(g&&g.img){const u=String((window.IMG||{})[g.img]||g.img).replace(/"/g,'');return `<img class="fig wide pic" src="${u}" alt="">`}
 if(!g||!Array.isArray(g.x)||!Array.isArray(g.y))return'';
 const W=280,H=210,[a,b]=g.x,[c,d]=g.y,X=x=>(x-a)/(b-a)*W,Y=y=>H-(y-c)/(d-c)*H,gx=st(b-a),gy=st(d-c);let s='';
 for(let v=Math.ceil(a/gx)*gx;v<=b+1e-9;v+=gx)s+=`<path d="M${X(v)} 0V${H}" stroke="#8884"/><text x="${X(v)+2}" y="${Math.min(Math.max(Y(0)+10,10),H-2)}" font-size="9" fill="#9aa">${+v.toFixed(2)}</text>`;
 for(let v=Math.ceil(c/gy)*gy;v<=d+1e-9;v+=gy)s+=`<path d="M0 ${Y(v)}H${W}" stroke="#8884"/><text x="${Math.min(Math.max(X(0)+3,0),W-18)}" y="${Y(v)-2}" font-size="9" fill="#9aa">${+v.toFixed(2)}</text>`;
 const sh=[].concat(g.shade||[]).map(t=>{const p=String(t).split(/(<=|>=|<|>)/);return[cf(p[0]),p[1],cf(p[2])]});
 if(sh.length){const cv=document.createElement('canvas');cv.width=W;cv.height=H;const k=cv.getContext('2d');k.fillStyle='rgba(129,140,248,.45)';
  for(let i=0;i<W;i+=2)for(let j=0;j<H;j+=2){const x=a+(i+1)/W*(b-a),y=d-(j+1)/H*(d-c);if(sh.every(([f,o,h])=>{const u=f(x,y),v=h(x,y);return o=='>'?u>v:o=='<'?u<v:o=='>='?u>=v:u<=v}))k.fillRect(i,j,2,2)}
  s+=`<image href="${cv.toDataURL()}" width="${W}" height="${H}"/>`}
 s+=`<path d="M0 ${Y(0)}H${W}M${X(0)} 0V${H}" stroke="#bbb" stroke-width="1.3"/>`;
 [].concat(g.fn||[]).forEach(o=>{const f=cf(o.f);let p='',u=0;for(let i=0;i<=200;i++){const x=a+i/200*(b-a),y=f(x,0);if(isFinite(y)&&Math.abs(y-(c+d)/2)<4*(d-c)){p+=(u?'L':'M')+X(x).toFixed(1)+' '+Y(y).toFixed(1);u=1}else u=0}s+=`<path d="${p}" fill="none" stroke="#a5b4fc" stroke-width="2"${o.d?' stroke-dasharray="6 4"':''}/>`});
 [].concat(g.ci||[]).forEach(o=>s+=`<ellipse cx="${X(o[0])}" cy="${Y(o[1])}" rx="${o[2]*W/(b-a)}" ry="${o[2]*H/(d-c)}" fill="none" stroke="#a5b4fc" stroke-width="2"${o[3]?' stroke-dasharray="6 4"':''}/>`);
 if(g.lx)s+=`<text x="${W-4}" y="${H-4}" text-anchor="end" font-size="11" fill="#cbd5e1">${esc(g.lx)}</text>`;
 if(g.ly)s+=`<text x="4" y="12" font-size="11" fill="#cbd5e1">${esc(g.ly)}</text>`;
 [].concat(g.vl||[]).forEach(o=>s+=`<path d="M${X(o.v)} 0V${H}" stroke="#a5b4fc" stroke-width="2"${o.d?' stroke-dasharray="6 4"':''}/>`);
 [].concat(g.pl||[]).forEach(l=>s+=`<polyline points="${l.map(p=>X(p[0])+','+Y(p[1])).join(' ')}" fill="none" stroke="#f472b6" stroke-width="2.4"/>`);
 [].concat(g.pt||[]).forEach(p=>s+=`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="3.5" fill="#fbbf24"/>`);
 [].concat(g.ar||[]).forEach(r=>s+=`<path d="M${X(r[0])} ${Y(r[1])}L${X(r[2])} ${Y(r[3])}" stroke="#34d399" stroke-width="2" marker-end="url(#ah)"/><text x="${X(r[2])+4}" y="${Y(r[3])-4}" font-size="11" fill="#34d399">${esc(r[4]||'')}</text>`);
 return `<svg class="fig" viewBox="0 0 ${W} ${H}"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#34d399"/></marker></defs>${s}</svg>`}
/* ---------- markdown ---------- */
function flow(t){const R=t.trim().split('\n').map(l=>l.split('->').map(x=>x.trim()).filter(Boolean)).filter(r=>r.length);if(!R.length)return'';
 const W=560,gp=26,n=Math.max(...R.map(r=>r.length)),bw=(W-gp*(n-1))/n,cpl=Math.max(6,Math.floor(bw/5.6));
 const wr=x=>{const o=[];let c='';x.split(' ').forEach(w=>{if(c&&(c+' '+w).length>cpl){o.push(c);c=w}else c=c?c+' '+w:w});o.push(c);return o};
 const Ls=R.map(r=>r.map(wr)),mx=Math.max(...Ls.flat().map(a=>a.length)),bh=14+13*mx,rh=bh+20;let s='';
 R.forEach((r,j)=>{const y=j*rh+4;r.forEach((x,i)=>{const X=i*(bw+gp),L=Ls[j][i],y0=y+(bh-13*L.length)/2+10;
  s+=`<rect x="${X}" y="${y}" width="${bw}" height="${bh}" rx="10" fill="#6366f133" stroke="#818cf8"/>`+L.map((a,k)=>`<text text-anchor="middle" font-size="10.5" fill="#e6e9f2" x="${X+bw/2}" y="${y0+13*k}">${esc(a)}</text>`).join('');
  if(i)s+=`<path d="M${X-gp+3} ${y+bh/2}H${X-3}" stroke="#34d399" stroke-width="2" marker-end="url(#fa)"/>`})});

/* ---------- progress: points, streak, hints, mistakes, mini-tests, dashboard ---------- */
const day=d=>(d||new Date()).toLocaleDateString('en-CA');
const metaR=()=>{try{return Object.assign({pts:0,streak:0,best:0,last:''},JSON.parse(rd(MK()))||{})}catch(e){return{pts:0,streak:0,best:0,last:''}}};

function bump(p){const m=metaR(),t=day();if(m.last!=t){m.streak=effStreak(m)+1;m.last=t;m.best=Math.max(m.best,m.streak)}m.pts+=p||0;const s=JSON.stringify(m);try{if(LS)LS.setItem(MK(),s);else MEM[MK()]=s}catch(e){}const e=$('#stat');if(e)e.textContent=stTxt()}

 st.slice(0,hn).forEach(s=>{if(s=='#5050'){const w=[...'ABCD'].filter(k=>k!=q.c),keep=w[hs(q.q)%3];gone=w.filter(k=>k!=keep);li+='<li>Два неверных варианта убраны</li>'}else li+='<li>'+esc(s)+'</li>'});

 return{gone,box:(li?`<div class="hintbox"><ul>${li}</ul></div>`:'')+btn}}

{const _sh=shell;shell=function(b){_sh(b);annRefresh();calcSync()};const _hm=home;home=function(){_hm();annRefresh();calcSync()}}


/* ---------- google auth ---------- */
const GID='549332087816-cjqvi6bjkoumsuqdj852vn7c14bma3io.apps.googleusercontent.com'; /* <-- вставьте свой Client ID из Google Cloud Console */
const jwtDecode=t=>{const p=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(decodeURIComponent(atob(p).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join('')))};
const authSave=u=>{try{if(LS)LS.setItem(AUTHK,JSON.stringify(u));else MEM[AUTHK]=JSON.stringify(u)}catch(e){}};
const authLoad=()=>{try{return JSON.parse(rd(AUTHK))||null}catch(e){return null}};
function authEnter(){document.getElementById('auth').style.display='none';document.body.classList.remove('auth-lock');S.run=S.deck=null;home()}
function showAuth(){document.body.classList.add('auth-lock');const a=document.getElementById('auth');a.style.display='grid';setTimeout(gisInit,300)}
function gisInit(){const w=document.getElementById('gbtn');if(!w)return;
 if(GID.indexOf('apps.googleusercontent.com')<0){w.innerHTML='<button class="btn" style="width:100%;margin-bottom:10px" onclick="toast(\'Сначала вставьте Client ID в коде: const GID\')">🔐 Войти через Google</button><button class="btn g2" style="width:100%" onclick="anonIn()">Продолжить без аккаунта →</button><p class="note">Client ID Google не задан — кнопка Google заработает, когда вы вставите ID в коде (const GID).</p>';return}
 if(!window.google||!google.accounts||!google.accounts.id){setTimeout(gisInit,500);return}
 google.accounts.id.initialize({client_id:GID,callback:gOnCred,auto_select:false});
 w.innerHTML='';google.accounts.id.renderButton(w,{theme:'filled_black',size:'large',shape:'pill',width:300,text:'continue_with',logo_alignment:'center'});
 if(!w.nextElementSibling||w.nextElementSibling.tagName!='BUTTON'){const b=document.createElement('button');b.className='ganon';b.textContent='Войти как гость';b.onclick=anonIn;w.after(b)}}
function gOnCred(r){try{const p=jwtDecode(r.credential);const u={em:p.email,name:p.name||p.email.split('@')[0],pic:p.picture||''};S.user=u;authSave(u);authEnter();toast('С возвращением, '+u.name+'!')}catch(e){toast('Ошибка входа')}}
function anonIn(){S.user={em:'guest',name:'Гость',pic:''};authSave(S.user);authEnter()}
function authAsk(){ask('Выйти из аккаунта «'+S.user.name+'»? Ваши данные сохранятся и появятся снова после входа.',()=>{rm(AUTHK);S.user=null;showAuth()})}
/* entry */
S.user=authLoad();
if(S.user&&S.user.em&&S.user.em!='guest')authEnter();else showAuth();
</script></body></html>
